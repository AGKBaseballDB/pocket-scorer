<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#173d2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="スコアラー">
<title>ポケットスコアラー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: phone-first single column. A stadium-scoreboard band on top (deep green, yellow numerals),
   a chalk-white work surface in the middle, and the pitch-result buttons pinned to the thumb zone. */
:root{
  --bg:#eef1ec; --paper:#ffffff; --ink:#18201c; --muted:#5b6860; --line:#d2d9ce;
  --board:#173d2d; --board-2:#0f2e21; --board-ink:#f3f0df; --board-dim:#9fb8a8; --board-num:#ffd54a;
  --accent:#c8402b; --accent-ink:#ffffff; --accent-soft:#f7dfd9;
  --ball:#2c9a52; --strike:#d9a200; --out:#d03a35;
  --ball-soft:#dcefe2; --strike-soft:#f7ecc7; --out-soft:#f6dcdb; --out-ink:#ffffff;
  --chip:#e3e8e0; --chip-ink:#18201c; --chip-on:#173d2d; --chip-on-ink:#ffffff;
  --zone:#e3e8e0; --zone-in:#cde0d1; --zone-edge:#6f8c79;
  --grass:#62ad70; --grass-2:#56a064; --dirt:#d9b98b; --chalk:#ffffff; --marker:#173d2d; --marker-ink:#ffffff;
  --scrim:rgba(8,18,13,.5); --shadow:0 -6px 18px rgba(8,18,13,.12); --bat-box:#9db5a4;
  --font-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-num:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1310; --paper:#161e19; --ink:#e7ece6; --muted:#9aa89f; --line:#2b3730;
    --board:#0f2a1f; --board-2:#0a2016; --board-ink:#efedd9; --board-dim:#86a090; --board-num:#ffd54a;
    --accent:#ff6b4f; --accent-ink:#1b0c08; --accent-soft:#3b201a;
    --ball:#45c173; --strike:#f0bd1c; --out:#ff5c54;
    --ball-soft:#163223; --strike-soft:#383012; --out-soft:#3a1a19; --out-ink:#1b0c08;
    --chip:#222c26; --chip-ink:#e7ece6; --chip-on:#d6ead9; --chip-on-ink:#0d1310;
    --zone:#1e2722; --zone-in:#274131; --zone-edge:#7a9886;
    --grass:#2f6d3c; --grass-2:#296234; --dirt:#86694a; --chalk:#e9efe6; --marker:#e9efe6; --marker-ink:#0d1310;
    --scrim:rgba(0,0,0,.62); --shadow:0 -6px 18px rgba(0,0,0,.4); --bat-box:#4b6b57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1310; --paper:#161e19; --ink:#e7ece6; --muted:#9aa89f; --line:#2b3730;
  --board:#0f2a1f; --board-2:#0a2016; --board-ink:#efedd9; --board-dim:#86a090; --board-num:#ffd54a;
  --accent:#ff6b4f; --accent-ink:#1b0c08; --accent-soft:#3b201a;
  --ball:#45c173; --strike:#f0bd1c; --out:#ff5c54;
  --ball-soft:#163223; --strike-soft:#383012; --out-soft:#3a1a19; --out-ink:#1b0c08;
  --chip:#222c26; --chip-ink:#e7ece6; --chip-on:#d6ead9; --chip-on-ink:#0d1310;
  --zone:#1e2722; --zone-in:#274131; --zone-edge:#7a9886;
  --grass:#2f6d3c; --grass-2:#296234; --dirt:#86694a; --chalk:#e9efe6; --marker:#e9efe6; --marker-ink:#0d1310;
  --scrim:rgba(0,0,0,.62); --shadow:0 -6px 18px rgba(0,0,0,.4); --bat-box:#4b6b57;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
#app{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.h2{font-size:17px;font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--strike-soft);border-radius:10px;padding:10px 12px;font-size:14px}

/* buttons */
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:0 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled,.key:disabled,.res:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dark{background:var(--board);color:var(--board-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--out);border-color:var(--out)}
.linkbtn{background:none;border:0;padding:6px 4px;color:var(--accent);font-weight:700}

/* top bars */
.masthead{background:var(--board);color:var(--board-ink)}
.mast-in{display:flex;align-items:center;gap:12px;padding-block:18px}
.masthead h1{font-size:22px;letter-spacing:.02em}
.masthead p{color:var(--board-dim);font-size:13px}
.mark{flex:none;width:44px;height:44px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);color:var(--board-ink)}
.topbar .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.topbar h1{font-size:17px;flex:1;min-width:0}
.topbar .btn{background:transparent;color:var(--board-ink);border-color:var(--board-dim)}

/* home */
.teamcard{display:flex;align-items:center;gap:12px}
.teamname{font-size:19px;font-weight:700}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.gopen{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.gline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gscore{font-family:var(--font-num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.chip-s{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--chip)}
.chip-s.live{background:var(--accent-soft);color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.demo{display:flex;align-items:center;gap:12px}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea,.inp{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:0 10px;font-size:16px;width:100%;min-width:0}
.f textarea{min-height:110px;padding:8px 10px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{flex:1;min-height:42px;border:0;background:transparent;font-weight:700;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--chip-on);color:var(--chip-on-ink)}
.prow{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pnum{font-family:var(--font-num);font-size:22px;font-weight:700;text-align:right}
.order{display:grid;grid-template-columns:26px 1fr 84px;gap:8px;align-items:center}
.order .on{font-family:var(--font-num);font-size:20px;font-weight:700;text-align:center}
.order-opp{display:grid;grid-template-columns:26px 58px 1fr 64px 70px;gap:6px;align-items:center}
.order-opp .on{font-family:var(--font-num);font-size:20px;font-weight:700;text-align:center}
.err{color:var(--out);font-size:13px;font-weight:700}
details summary{cursor:pointer;font-weight:700;min-height:28px}

/* scoreboard band */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);color:var(--board-ink)}
.board .wrap{padding-block:6px 8px;display:flex;flex-direction:column;gap:5px}
.b-top{display:flex;align-items:center;gap:8px}
.b-top .iconbtn:disabled{opacity:.4}
.b-top .iconbtn{white-space:nowrap;flex:none;min-width:44px;min-height:36px;border-radius:8px;border:1px solid var(--board-dim);background:transparent;color:var(--board-ink);font-weight:700;padding:0 10px}
.inn{font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--board-num);letter-spacing:.02em;white-space:nowrap}
.inn small{font-family:var(--font-body);font-size:15px;margin-left:2px;color:var(--board-ink)}
.sync{font-size:11px;color:var(--board-dim);flex:1;min-width:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm.home{flex-direction:row-reverse;text-align:right}
.tn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tm.bat .tn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--board-num);margin-right:6px;vertical-align:middle}
.tr{font-family:var(--font-num);font-size:28px;font-weight:700;line-height:1;color:var(--board-num);font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.vs{color:var(--board-dim);font-size:12px}
.sit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--board-2);border-radius:10px;padding:4px 10px}
.bso{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-family:var(--font-num);font-weight:700;font-size:15px}
.bso > span{display:inline-flex;align-items:center;gap:5px}
.dots{display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--board-dim)}
.dot.b.on{background:var(--ball);border-color:var(--ball)}
.dot.s.on{background:var(--strike);border-color:var(--strike)}
.dot.o.on{background:var(--out);border-color:var(--out)}
.dia{width:44px;height:44px;justify-self:center}
.pc{text-align:right;font-size:11px;color:var(--board-dim);line-height:1.2}
.pc b{display:block;font-family:var(--font-num);font-size:21px;color:var(--board-ink)}

/* matchup */
.mu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu .card{padding:8px 10px}
.mu .who{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hand{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;background:var(--chip);margin-left:4px;vertical-align:2px}
.seq{display:flex;gap:4px;flex-wrap:wrap;min-height:20px}
.pchip{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--chip);display:inline-flex;gap:3px;align-items:baseline;border:0}
button.pchip{font-size:13px;min-height:32px;padding:2px 9px;font-weight:700;align-items:center}
.lastpa{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:44px;font-size:14px}
.lastpa .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fix{color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.parow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:8px 2px;min-height:48px}
.pa-list .parow:first-child{border-top:0}
button.pbox{border:0;cursor:pointer;font:inherit;font-size:11px;min-height:36px}
.pchip.B{background:var(--ball-soft)} .pchip.K,.pchip.S,.pchip.F,.pchip.BF{background:var(--strike-soft)} .pchip.X{background:var(--accent-soft)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tools .btn{min-height:40px;padding:0 4px;font-size:13px}

/* input area */
.inwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.tcol .tchip{font-size:min(12px,3vw);letter-spacing:-.05em;white-space:nowrap;overflow:hidden}
.tcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.zcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.zhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.zbox{display:grid;grid-template-columns:8px minmax(0,1fr) 8px;gap:3px;align-items:stretch}
.bside{border-radius:6px}
.bside.on{background:var(--bat-box)}
.zside{display:flex;font-size:12px;color:var(--muted);min-height:20px;align-items:center}
.zside .hand{margin:0}
.zone{position:relative;width:100%;height:0;padding:0 0 112% 0;background:var(--zone);border-radius:8px;align-self:start}
.zgrid{position:absolute;top:0;left:0;right:0;bottom:0;padding:2px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:2px}
.zmarks{position:absolute;top:2px;left:2px;width:calc(100% - 4px);height:calc(100% - 4px);pointer-events:none;overflow:visible}
.zc{-webkit-appearance:none;appearance:none;border:0;border-radius:4px;background:var(--paper);min-height:0;min-width:0;width:100%;height:100%;padding:0;margin:0;position:relative;display:block;cursor:pointer}
.zc.in{background:var(--zone-in)}
.zc.on{box-shadow:inset 0 0 0 2px var(--accent)}
.zinfo{font-size:12px;color:var(--muted);min-height:18px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.key{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:var(--font-num);font-size:20px;font-weight:600;padding:0}
.key.wide{grid-column:span 2;font-family:var(--font-body);font-size:13px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.types.three{grid-template-columns:repeat(3,1fr)}
.zmini{max-width:230px;width:100%}
.tchip{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;padding:2px 2px;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
.ticon{width:14px;height:14px;flex:none;overflow:visible}
.legend{font-size:11px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid currentColor;vertical-align:-1px;margin-right:3px}
.legend .lb{color:var(--ball)} .legend .ls{color:var(--strike)} .legend .lx{color:var(--accent)} .legend .lh{color:var(--out)}
.zmini-svg{width:100%;height:auto;display:block}
.pa-zone{width:140px;max-width:45%;align-self:center}
.pa.has-z{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:4px 10px;align-items:start}
.pa.has-z .pa-zm{grid-row:1 / span 3;grid-column:2;padding-top:2px}
.tchip.on,.fchip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}

/* thumb bar */
.results{position:sticky;bottom:0;z-index:15;background:var(--bg);box-shadow:var(--shadow);margin-top:6px}
.results .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px))}
.res{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;padding:0 2px}
.res.B{background:var(--ball-soft);border-color:var(--ball)}
.res.K,.res.S{background:var(--strike-soft);border-color:var(--strike)}
.res.X{grid-column:span 2;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;border:0;width:100%}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:var(--shadow)}
.sheet-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h3{flex:1;font-size:17px}
.optgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700}
.opt.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.opt.hit{border-color:var(--accent)}
.field{width:100%;max-width:100%;height:auto;display:block;border-radius:12px;background:var(--paper);touch-action:manipulation;cursor:crosshair}
.fchips{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.fchip{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:13px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.fchip small{font-family:var(--font-num);font-size:11px;font-weight:600;color:var(--muted)}
.fchip.on small{color:inherit}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px;background:var(--chip);border-radius:10px;padding:4px 6px 4px 12px}
.chain b{font-family:var(--font-num);font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.rrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rwho{font-size:14px}
.rwho b{font-size:15px}
.seg5{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:4px}
.seg5 button{min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:700;padding:0}
.seg5 button.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.seg5 button.on.out{background:var(--out);border-color:var(--out);color:var(--out-ink)}
.seg5 button.on.home{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sum{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--chip);border-radius:10px;padding:8px 12px}
.sum > span:first-child{white-space:nowrap}
.stepper .small{white-space:nowrap}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:18px}
.stepper b{font-family:var(--font-num);font-size:24px;min-width:22px;text-align:center}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start}

<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var app = document.getElementById('app');

/* ---------- constants ---------- */
var POS = ['投','捕','一','二','三','遊','左','中','右','DH'];
var POS_NUM = {'投':1,'捕':2,'一':3,'二':4,'三':5,'遊':6,'左':7,'中':8,'右':9};
var FLD = ['','投','捕','一','二','三','遊','左','中','右'];
var PT = ['ストレート','ツーシーム','カット','スライダー','カーブ','フォーク','チェンジアップ','シンカー','その他'];
var PR = {B:'ボール',K:'見逃し',S:'空振り',F:'ファウル',X:'インプレー',HBP:'死球',BF:'バントファウル',IBB:'申告敬遠'};
var PRS = {B:'B',K:'見',S:'空',F:'F',X:'打',HBP:'死',BF:'BF',IBB:'敬'};
var PLAY = {
  GO:{l:'凡打',ab:1}, '1B':{l:'単打',ab:1,hit:1}, '2B':{l:'二塁打',ab:1,hit:1}, '3B':{l:'三塁打',ab:1,hit:1}, HR:{l:'本塁打',ab:1,hit:1},
  E:{l:'失策',ab:1}, FC:{l:'野選',ab:1}, SH:{l:'犠打'}, SF:{l:'犠飛'}, DP:{l:'併殺打',ab:1},
  K:{l:'三振',ab:1,k:1}, KWP:{l:'振り逃げ',ab:1,k:1}, BB:{l:'四球'}, IBB:{l:'敬遠'}, HBP:{l:'死球'}
};
var INPLAY = ['GO','1B','2B','3B','HR','E','FC','SH','SF','DP'];
var BT = {G:'ゴロ',F:'フライ',L:'ライナー',B:'バント'};
var RUN = {SB:'盗塁',CS:'盗塁死',PO:'牽制死',WP:'暴投',PB:'捕逸',BK:'ボーク',OB:'走塁死',AD:'その他の進塁'};
var FPOS = [null,[150,212],[150,262],[194,200],[172,168],[106,200],[128,168],[68,112],[150,84],[232,112]];
var HOME = [150,248];
var SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
function pageURL(){ return location.href.split('#')[0]; }
function fbConfigured(){ var c = window.FIREBASE_CONFIG; return !!(c && c.projectId && c.apiKey); }

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function fmtDate(s){ if(!s) return ''; var p=s.split('-'); return p.length===3 ? (+p[1])+'/'+(+p[2]) : s; }
function pname(p){ return (p && p.name) || '—'; }
function sideOf(batter, pitcher){ var b = (batter && batter.bats) || '右'; if(b==='両') return (pitcher && pitcher.throws==='左') ? '右' : '左'; return b; }
function pkey(team, p){ return team + '|' + (p ? (p.pid || ((p.name||'') + '#' + (p.num||''))) : '-'); }

var LS = {
  get: function(k,d){ try{ var v=localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- state ---------- */
var S = {
  view:'home', team:{name:'', players:[], rev:0}, games:{}, game:null, demo:false,
  mode:'local', sync:'', readOnly:false, dl:null, db:null,
  ui:freshUI(), redo:[], toast:'', setup:null, newp:null, editp:null, confirm:null,
  flip:LS.get('ps.flip', false), logTab:'pa', csv:null, unsub:null, wake:null
};
function freshUI(){ return {z:null, pt:null, v:'', sheet:null, play:null, pend:null, moves:{}, rbi:0, rbiTouched:false, runType:null, subTeam:null, subSlot:null, sub:null}; }

/* ---------- storage ---------- */
var Store = {
  chains:{}, timers:{},
  connect: function(){
    if(!fbConfigured()) return Promise.resolve(null);
    var ld = function(n){ return loadScript(SDK + n); };
    return ld('firebase-app-compat.js').then(function(){ return Promise.all([ld('firebase-firestore-compat.js'), ld('firebase-auth-compat.js')]); }).then(function(){
      if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
      FB.fs = firebase.firestore(); FB.auth = firebase.auth();
      return makeDb(FB.fs);
    }).catch(function(){ return null; });
  },
  write: function(path, data){
    var self=this, run=function(){ return S.db.doc(path).set(data); };
    var p = (self.chains[path] || Promise.resolve()).then(run, run);
    self.chains[path] = p.catch(function(){});
    return p;
  },
  later: function(path, getData, ms){
    var self=this;
    clearTimeout(self.timers[path]);
    setSync('saving');
    self.timers[path] = setTimeout(function(){
      self.write(path, getData()).then(function(){ setSync('saved'); }, function(e){
        if(e && (e.code==='permission-denied' || e.code==='invalid_argument')){ S.denied = true; S.readOnly = true; render(); }
        setSync('error');
      });
    }, ms||500);
  }
};
var FB = {fs:null, auth:null};
function loadScript(src){
  return new Promise(function(res, rej){ var el = document.createElement('script'); el.src = src; el.async = true; el.onload = function(){ res(); }; el.onerror = function(){ rej(new Error('load ' + src)); }; document.head.appendChild(el); });
}
/* Firestore can't hold nested arrays, so each document stores the object as JSON text plus a few fields for sorting. */
function makeDb(fs){
  var cache = {};
  function decode(id, raw){
    if(!raw) return undefined;
    if(typeof raw.j !== 'string') return raw;
    var key = id + '|' + raw.rev + '|' + raw.updatedAt;
    if(cache[id] && cache[id].key === key) return clone(cache[id].val);
    try{ var v = JSON.parse(raw.j); cache[id] = {key:key, val:v}; return clone(v); }catch(e){ return undefined; }
  }
  function wrap(sn){ var raw = sn.exists ? sn.data() : null; return {id:sn.id, exists:!!sn.exists, metadata:sn.metadata || {}, data:function(){ return decode(sn.id, raw); }}; }
  function encode(o){ return {j:JSON.stringify(o), rev:o.rev||0, updatedAt:o.updatedAt||Date.now(), status:o.status||'', date:o.date||''}; }
  return {
    doc:function(path){ var r = fs.doc(path); return {
      get:function(){ return r.get().then(wrap); },
      set:function(o){ return r.set(encode(o)); },
      delete:function(){ return r.delete(); },
      onSnapshot:function(cb, err){ return r.onSnapshot(function(sn){ cb(wrap(sn)); }, err || function(){}); }
    }; },
    collection:function(name){ var c = fs.collection(name); return {
      get:function(){ return c.get().then(function(q){ return {docs:q.docs.map(wrap)}; }); },
      onSnapshot:function(cb, err){ return c.onSnapshot(function(q){ cb({docs:q.docs.map(wrap)}); }, err || function(){}); }
    }; }
  };
}
function setSync(s){ S.sync = s; var el=document.getElementById('sync'); if(el) el.textContent = syncText(); }
function syncText(){
  if(S.demo) return 'デモ（保存なし）';
  if(S.mode!=='db') return 'この端末に保存';
  if(navigator.onLine === false) return '電波なし（端末に保存済み）';
  if(S.denied) return '記録の権限がありません';
  return {saving:'送信中…', saved:'配信済み', error:'送信できませんでした（端末には保存済み）'}[S.sync] || '配信済み';
}
function persistLocal(){ LS.set('ps.team', S.team); LS.set('ps.games', S.games); }
function saveTeam(){
  S.team.rev = (S.team.rev||0) + 1; S.team.updatedAt = Date.now();
  LS.set('ps.team', S.team); saverKick();
  if(S.db && !S.readOnly) Store.later('team/main', function(){ return clone(S.team); }, 400);
}
function saveGame(){
  var g = S.game; if(!g || S.demo) return;
  g.rev = (g.rev||0) + 1; g.updatedAt = Date.now();
  S.games[g.id] = g; LS.set('ps.games', S.games); saverKick();
  if(S.db && !S.readOnly) Store.later('games/'+g.id, function(){ return clone(S.game && S.game.id===g.id ? S.game : g); }, 500);
}
function syncFromDb(){
  var db = S.db;
  if(S.readOnly){
    return db.collection('games').get().then(function(qs){
      var ro = {};
      qs.docs.forEach(function(d){ var g = d.data(); if(g && g.id) ro[g.id] = clone(g); });
      S.games = ro;
    });
  }
  return Promise.all([
    db.doc('team/main').get(),
    db.collection('games').get(),
    db.collection('deleted').get()
  ]).then(function(r){
    var t = r[0], qs = r[1], ds = r[2];
    var dead = {}; ds.docs.forEach(function(d){ dead[d.id] = 1; });
    if(t.exists){
      var rt = t.data();
      if((S.team.rev||0) > (rt.rev||0) && S.team.players.length){ Store.write('team/main', clone(S.team)).catch(function(){}); }
      else { S.team = clone(rt); if(!Array.isArray(S.team.players)) S.team.players = []; }
    } else if(S.team.players.length || S.team.name){ Store.write('team/main', clone(S.team)).catch(function(){}); }
    var remote = {};
    qs.docs.forEach(function(d){ var g=d.data(); if(g && g.id && !dead[g.id]) remote[g.id] = clone(g); });
    Object.keys(S.games).forEach(function(id){
      var lg = S.games[id];
      if(dead[id]) return;
      if(!remote[id] || (lg.rev||0) > (remote[id].rev||0)){ remote[id] = lg; Store.write('games/'+id, clone(lg)).catch(function(){}); }
    });
    S.games = remote; persistLocal();
  });
}
function watchGame(){
  if(S.unsub){ try{ S.unsub(); }catch(e){} S.unsub=null; }
  if(!S.db || !S.game || S.demo || S.readOnly) return;
  var id = S.game.id;
  try{
    S.unsub = S.db.doc('games/'+id).onSnapshot(function(snap){
      if(!snap.exists || snap.metadata.hasPendingWrites) return;
      var d = snap.data();
      if(S.game && S.game.id===id && (d.rev||0) > (S.game.rev||0)){
        S.game = clone(d); S.games[id] = S.game; if(!S.readOnly) LS.set('ps.games', S.games); S.liveAt = Date.now();
        if(!S.ui.sheet) render();
      }
    }, function(){});
  }catch(e){}
}

function stopListeners(){
  if(S.unsub){ try{ S.unsub(); }catch(e){} S.unsub = null; }
  if(S.unlist){ try{ S.unlist(); }catch(e){} S.unlist = null; }
}
function watchList(){
  if(S.unlist || !S.db) return;
  try{
    S.unlist = S.db.collection('games').onSnapshot(function(qs){
      var m = {};
      qs.docs.forEach(function(d){ var g = d.data(); if(g && g.id) m[g.id] = clone(g); });
      S.games = m;
      if(S.game && !S.demo && m[S.game.id] && (m[S.game.id].rev||0) > (S.game.rev||0)){ S.game = m[S.game.id]; S.liveAt = Date.now(); }
      autoOpen();
      if(!S.ui.sheet && (S.view==='home' || S.view==='live')) render();
    }, function(){});
  }catch(e){}
}
function autoOpen(){
  if(S.autoOpened || S.mode!=='db') return;
  var hash = (location.hash || '').replace(/^#/, '');
  var g = hash ? S.games[hash] : null;
  if(!g && S.readOnly){
    g = Object.keys(S.games).map(function(k){ return S.games[k]; }).filter(function(x){ return x.status!=='final'; }).sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); })[0];
  }
  if(!g) return;
  S.autoOpened = true;
  S.game = g; S.demo = false; S.redo = []; S.ui = freshUI(); watchGame(); go(S.readOnly ? 'live' : 'score');
}
function updatedLabel(g){
  if(!g || !g.updatedAt) return '';
  var d = new Date(g.updatedAt);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' 更新';
}

/* ---------- PC folder saving (Chrome / Edge on a computer) ---------- */
var Saver = {dir:null, perm:'none', last:{}, src:null, unsub:null, timer:null, busy:false, at:0, n:0, err:''};
function saverSupported(){ return typeof window.showDirectoryPicker === 'function'; }
function idbOpen(){
  return new Promise(function(res, rej){
    try{ var r = indexedDB.open('pocket-scorer', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); }; r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }catch(e){ rej(e); }
  });
}
function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res){ var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
function idbSet(k, v){ return idbOpen().then(function(db){ return new Promise(function(res){ var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = function(){ res(true); }; t.onerror = function(){ res(false); }; }); }).catch(function(){ return false; }); }
function saverInit(){
  if(!saverSupported()) return;
  idbGet('dir').then(function(h){
    if(!h || !h.queryPermission) return;
    Saver.dir = h;
    return h.queryPermission({mode:'readwrite'}).then(function(p){ Saver.perm = p; if(p==='granted') saverStart(); render(); });
  });
}
function saverStart(){
  Saver.err = '';
  saverListen();
  saverKick();
}
function saverListen(){
  if(Saver.unsub){ try{ Saver.unsub(); }catch(e){} Saver.unsub = null; }
  if(!S.db || !Saver.dir || Saver.perm!=='granted') return;
  try{
    Saver.unsub = S.db.collection('games').onSnapshot(function(qs){
      var m = {}; qs.docs.forEach(function(d){ var g = d.data(); if(g && g.id) m[g.id] = g; });
      Saver.src = m; saverKick();
    }, function(){});
  }catch(e){}
}
function saverStop(){
  if(Saver.unsub){ try{ Saver.unsub(); }catch(e){} Saver.unsub = null; }
  Saver.dir = null; Saver.perm = 'none'; Saver.src = null; Saver.last = {}; Saver.n = 0; Saver.at = 0;
  idbSet('dir', null);
}
function saverKick(){
  if(!Saver.dir || Saver.perm!=='granted') return;
  clearTimeout(Saver.timer); Saver.timer = setTimeout(saverFlush, 1200);
}
function fileSafe(t){ return String(t == null ? '' : t).replace(/[\\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60); }
function gameFolder(g){
  var t = g.createdAt ? new Date(g.createdAt) : null;
  var hm = t ? String(t.getHours()).padStart(2,'0') + String(t.getMinutes()).padStart(2,'0') : '0000';
  return fileSafe((g.date || 'nodate') + '_' + hm + '_' + (g.names ? g.names[0] + 'vs' + g.names[1] : g.id));
}
function rosterCSV(team){
  var lines = [csvLine(['背番号','氏名','守備位置','投','打'])];
  (team.players || []).forEach(function(p){ lines.push(csvLine([p.num||'', p.name||'', p.pos||'', p.throws||'', p.bats||''])); });
  return '﻿' + lines.join('\r\n') + '\r\n';
}
function writeText(dirH, name, text){
  return dirH.getFileHandle(name, {create:true}).then(function(fh){ return fh.createWritable(); }).then(function(w){ return w.write(text).then(function(){ return w.close(); }); });
}
function saverFlush(){
  if(!Saver.dir || Saver.perm!=='granted') return;
  if(Saver.busy){ saverKick(); return; }
  var all = {};
  [Saver.src || {}, S.readOnly ? {} : S.games].forEach(function(m){ Object.keys(m).forEach(function(id){ var g = m[id]; if(!g || !g.id || !Array.isArray(g.events)) return; if(!all[id] || (g.rev||0) > (all[id].rev||0)) all[id] = g; }); });
  var jobs = Object.keys(all).map(function(id){ return all[id]; }).filter(function(g){ return Saver.last[g.id] !== (g.rev||0) + '|' + (g.updatedAt||0); });
  var teamJob = !S.readOnly && S.team && (S.team.players||[]).length && Saver.last.__team !== (S.team.rev||0) + '|' + (S.team.updatedAt||0);
  if(!jobs.length && !teamJob) return;
  Saver.busy = true;
  var root = Saver.dir, done = 0;
  var chain = root.getDirectoryHandle('試合データ', {create:true}).then(function(gdir){
    return jobs.reduce(function(p, g){
      return p.then(function(){
        return gdir.getDirectoryHandle(gameFolder(g), {create:true}).then(function(fd){
          var keep = S.game; S.game = g;
          var csvP, csvB, csvT;
          try{ csvP = buildCSV('pitch', g); csvB = buildCSV('bat', g); csvT = buildCSV('pit', g); }catch(e){} finally{ S.game = keep; }
          return writeText(fd, '試合データ.json', JSON.stringify(g, null, 1))
            .then(function(){ return csvP ? writeText(fd, '一球データ.csv', csvP) : null; })
            .then(function(){ return csvB ? writeText(fd, '打撃成績.csv', csvB) : null; })
            .then(function(){ return csvT ? writeText(fd, '投手成績.csv', csvT) : null; })
            .then(function(){ Saver.last[g.id] = (g.rev||0) + '|' + (g.updatedAt||0); done++; });
        });
      });
    }, Promise.resolve());
  });
  if(teamJob){
    var tm = clone(S.team);
    chain = chain.then(function(){ return writeText(root, '選手マスタ.json', JSON.stringify(tm, null, 1)); })
      .then(function(){ return writeText(root, '選手マスタ.csv', rosterCSV(tm)); })
      .then(function(){ Saver.last.__team = (tm.rev||0) + '|' + (tm.updatedAt||0); done++; });
  }
  chain.then(function(){
    Saver.busy = false; Saver.at = Date.now(); Saver.n += done; Saver.err = '';
    var el = document.getElementById('saver-status'); if(el) el.textContent = saverStatus(); else if(S.view==='home') render();
  }, function(e){
    Saver.busy = false;
    Saver.err = (e && e.name==='NotAllowedError') ? 'フォルダへの書き込みが許可されていません。「自動保存を再開」を押してください。' : 'フォルダに保存できませんでした。';
    if(e && e.name==='NotAllowedError') Saver.perm = 'prompt';
    render();
  });
}
function saverStatus(){
  if(!Saver.at) return '保存の準備ができました。記録が更新されると、ここに保存されます。';
  var d = new Date(Saver.at);
  return '最終保存 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0') + '（このページを開いてから ' + Saver.n + ' 件）';
}
function saverCard(){
  var writer = !S.readOnly;
  if(!saverSupported()){
    if(!writer) return '';

function importGames(files){
  var list = Array.prototype.slice.call(files || []);
  if(!list.length || S.readOnly) return;
  Promise.all(list.map(function(f){ return f.text().then(function(t){ try{ return JSON.parse(t); }catch(e){ return null; } }, function(){ return null; }); })).then(function(objs){
    var found = [];
    objs.forEach(function(o){
      if(!o) return;
      if(o.games && typeof o.games === 'object'){ Object.keys(o.games).forEach(function(k){ found.push(o.games[k]); }); }
      else found.push(o);
    });
    var added = 0, skipped = 0;
    found.forEach(function(g){
      if(!g || !g.id || !Array.isArray(g.events) || !Array.isArray(g.names)){ skipped++; return; }
      var cur = S.games[g.id];
      if(cur && (cur.rev||0) > (g.rev||0)){ skipped++; return; }
      g = clone(g); g.rev = Math.max(cur ? cur.rev||0 : 0, g.rev||0) + 1; g.updatedAt = Date.now();
      S.games[g.id] = g; added++;
      if(S.db){ S.db.doc('deleted/' + g.id).delete().catch(function(){}); Store.later('games/' + g.id, (function(x){ return function(){ return clone(x); }; })(g), 300); }
    });

    flash(added ? added + '試合を戻しました' + (skipped ? '（' + skipped + '件はスキップ）' : '') : '戻せる試合がありませんでした');
    render();
  });
}

/* ---------- scoring engine (replays the event list) ---------- */
function stat(map, key, p, team, kind){
  if(!map[key]){
    map[key] = kind==='pit'
      ? {key:key, team:team, name:pname(p), num:p&&p.num||'', np:0, str:0, bf:0, outs:0, h:0, hr:0, k:0, bb:0, hbp:0, r:0, wp:0}
      : {key:key, team:team, name:pname(p), num:p&&p.num||'', pa:0, ab:0, h:0, d2:0, d3:0, hr:0, rbi:0, r:0, bb:0, hbp:0, k:0, sh:0, sf:0, sb:0, cs:0, order:99};
  }
  return map[key];
}
function replay(g, upto){
  var st = {inning:1, half:0, outs:0, b:0, s:0, bases:[null,null,null], order:[0,0],
    L:clone(g.lineups), P:clone(g.pitchers), line:[[0],[]], H:[0,0], E:[0,0], R:[0,0], LOB:[0,0],
    bat:{}, pit:{}, pas:[], tl:[], cur:null};
  g.lineups.forEach(function(l,t){ l.forEach(function(p,i){ stat(st.bat, pkey(t,p), p, t).order = i; }); });
  var n = upto == null ? g.events.length : Math.min(upto, g.events.length);
  for(var i=0;i<n;i++){ st._i = i; apply(st, g.events[i]); }
  return st;
}
function batterNow(st){ var t=st.half; return {team:t, slot:st.order[t], p:st.cur ? st.cur.batter : st.L[t][st.order[t]]}; }
function startPA(st){
  var t = st.half, slot = st.order[t];
  st.cur = {inning:st.inning, half:t, team:t, slot:slot, batter:clone(st.L[t][slot]), pitcher:clone(st.P[1-t]), pitches:[], res:null, rbi:0, runs:0, outs:0};
}
function apply(st, e){
  if(e.k==='pitch') applyPitch(st, e);
  else if(e.k==='run') applyRun(st, e);
  else if(e.k==='sub') applySub(st, e);
}
function applyPitch(st, e){
  if(!st.cur) startPA(st);
  var pa = st.cur, ft = 1 - st.half;
  var P = stat(st.pit, pkey(ft, st.P[ft]), st.P[ft], ft, 'pit');
  if(e.r !== 'IBB'){ P.np++; if(e.r!=='B' && e.r!=='HBP') P.str++; }
  pa.pitches.push({r:e.r, z:e.z, pt:e.pt, b:st.b, s:st.s, o:st.outs, n:P.np, i:st._i, th:(st.P[ft] && st.P[ft].throws) || '右'});
  if(e.r==='B') st.b++;
  else if(e.r==='K' || e.r==='S' || e.r==='BF') st.s++;
  else if(e.r==='F' && st.s<2) st.s++;
  if(e.end) endPA(st, e.end);
  else if(e.r==='X') autoEnd(st, 'GO');
  else if(e.r==='HBP') autoEnd(st, 'HBP');
  else if(e.r==='IBB') autoEnd(st, 'IBB');
  else if(st.b >= 4) autoEnd(st, 'BB');
  else if(st.s >= 3) autoEnd(st, 'K');
}
function autoEnd(st, res){ var m = defaultMoves(res, st.bases.map(Boolean)); endPA(st, {res:res, moves:m, rbi:defaultRbi(res, m)}); }
function moveRunners(st, moves, batter){
  var bt = st.half, ft = 1-bt, P = stat(st.pit, pkey(ft, st.P[ft]), st.P[ft], ft, 'pit');
  var list = [];
  if(batter) list.push(['b', batter]);
  st.bases.forEach(function(r,i){ if(r) list.push([String(i+1), r]); });
  var nb = [null,null,null], runs = 0, outs = 0, scored = [];
  list.forEach(function(x){
    var k = x[0], r = x[1], d = moves[k];
    if(d == null) d = (k==='b') ? 0 : +k;
    if(d === 0) outs++;
    else if(d === 4){
      runs++; scored.push(r.name);
      stat(st.bat, r.key, r, bt).r++; P.r++;
      st.line[bt][st.inning-1] = (st.line[bt][st.inning-1]||0) + 1; st.R[bt]++;
    } else nb[d-1] = r;
  });
  st.bases = nb; st.outs += outs; P.outs += outs;
  return {runs:runs, outs:outs, scored:scored};
}
function endPA(st, end){
  var pa = st.cur, bt = st.half, ft = 1-bt;
  var batter = Object.assign({team:bt, slot:pa.slot}, pa.batter); batter.key = pkey(bt, pa.batter);
  var P = stat(st.pit, pkey(ft, st.P[ft]), st.P[ft], ft, 'pit');
  var B = stat(st.bat, batter.key, pa.batter, bt);
  var mv = moveRunners(st, end.moves || {}, batter);
  var d = PLAY[end.res] || {l:end.res};
  pa.res = end.res; pa.play = end.play || null; pa.rbi = end.rbi || 0; pa.runs = mv.runs; pa.outs = mv.outs; pa.scored = mv.scored;
  B.pa++; P.bf++;
  if(d.ab) B.ab++;
  if(d.hit){ B.h++; P.h++; st.H[bt]++; if(end.res==='2B') B.d2++; if(end.res==='3B') B.d3++; if(end.res==='HR'){ B.hr++; P.hr++; } }
  if(end.res==='BB' || end.res==='IBB'){ B.bb++; P.bb++; }
  if(end.res==='HBP'){ B.hbp++; P.hbp++; }
  if(d.k){ B.k++; P.k++; }
  if(end.res==='SH') B.sh++;
  if(end.res==='SF') B.sf++;
  if(end.res==='E') st.E[ft]++;
  B.rbi += pa.rbi;
  st.pas.push(pa); st.tl.push({t:'pa', pa:pa, inning:pa.inning, half:pa.half});
  st.cur = null; st.b = 0; st.s = 0;
  st.order[bt] = (st.order[bt] + 1) % 9;
  afterPlay(st);
}
function applyRun(st, e){
  var bt = st.half, ft = 1-bt;
  var before = st.bases.slice();
  var names = [];
  before.forEach(function(r,i){
    if(!r) return; var d = e.moves[String(i+1)];
    if(d == null || d === i+1) return;
    names.push(r.name + (d===0 ? '（アウト）' : d===4 ? '（生還）' : '（'+FLD[0]+['','一','二','三'][d]+'塁へ）'));
    if(e.type==='SB' && d>i+1) stat(st.bat, r.key, r, bt).sb++;
    if((e.type==='CS') && d===0) stat(st.bat, r.key, r, bt).cs++;
  });
  if(e.type==='WP'){ stat(st.pit, pkey(ft, st.P[ft]), st.P[ft], ft, 'pit').wp++; }
  var mv = moveRunners(st, e.moves || {}, null);
  st.tl.push({t:'note', kind:'run', i:st._i, inning:st.inning, half:st.half, text:(RUN[e.type]||'走者') + (e.thr && e.thr.length ? '（' + e.thr.join('-') + '）' : '') + (names.length ? '：' + names.join('、') : '')});
  afterPlay(st);
}
function applySub(st, e){
  var t = e.team, p = clone(e.player), text;
  if(e.slot === 'P'){
    var old = st.P[t]; p.pos = '投'; st.P[t] = p;
    var hasDH = st.L[t].some(function(x){ return x.pos==='DH'; });
    var i = st.L[t].findIndex(function(x){ return x.pos==='投'; });
    if(i >= 0 && !hasDH) st.L[t][i] = clone(p);
    stat(st.pit, pkey(t, p), p, t, 'pit');
    text = '投手交代：' + pname(old) + ' → ' + pname(p);
  } else {
    var prev = st.L[t][e.slot];
    p.pos = e.pos || p.pos || prev.pos;
    st.L[t][e.slot] = p;
    if(p.pos === '投') st.P[t] = clone(p);
    stat(st.bat, pkey(t,p), p, t).order = e.slot;
    st.bases = st.bases.map(function(r){ if(r && r.team===t && r.slot===e.slot){ var nr = Object.assign({team:t, slot:e.slot}, p); nr.key = pkey(t,p); return nr; } return r; });
    if(st.cur && st.cur.team===t && st.cur.slot===e.slot) st.cur.batter = clone(p);
    text = (e.slot+1) + '番 ' + (prev.pid===p.pid && prev.name===p.name ? pname(p) + '：守備位置 ' + (prev.pos||'—') + ' → ' + (p.pos||'—') : pname(prev) + ' → ' + pname(p) + '（' + (p.pos||'—') + '）');
  }
  st.tl.push({t:'note', kind:'sub', i:st._i, inning:st.inning, half:st.half, team:t, text:text});
}
function afterPlay(st){
  if(st.outs < 3) return;
  st.LOB[st.half] += st.bases.filter(Boolean).length;
  if(st.cur){ st.cur.res = null; st.cur.incomplete = true; st.pas.push(st.cur); st.tl.push({t:'pa', pa:st.cur, inning:st.cur.inning, half:st.cur.half}); st.cur = null; }
  st.outs = 0; st.b = 0; st.s = 0; st.bases = [null,null,null];
  if(st.half === 0){ st.half = 1; st.line[1][st.inning-1] = st.line[1][st.inning-1] || 0; }
  else { st.half = 0; st.inning++; st.line[0][st.inning-1] = 0; }
}

/* ---------- default runner movement ---------- */
function defaultMoves(res, occ){
  var m = {};
  occ.forEach(function(o,i){ if(o) m[i+1] = i+1; });
  function adv(n){ occ.forEach(function(o,i){ if(o) m[i+1] = Math.min(4, i+1+n); }); }
  function force(){ if(occ[0]){ m[1]=2; if(occ[1]){ m[2]=3; if(occ[2]) m[3]=4; } } }
  function lead(){ if(occ[0]){ if(occ[1]){ return occ[2] ? 3 : 2; } return 1; } return 0; }
  switch(res){
    case '1B': m.b=1; adv(1); break;
    case '2B': m.b=2; adv(2); break;
    case '3B': m.b=3; adv(3); break;
    case 'HR': m.b=4; adv(3); break;
    case 'BB': case 'IBB': case 'HBP': case 'E': case 'KWP': m.b=1; force(); break;
    case 'FC': m.b=1; force(); var l=lead(); if(l) m[l]=0; else { var hi = occ[2]?3:occ[1]?2:0; if(hi) m[hi]=0; } break;
    case 'SH': m.b=0; adv(1); break;
    case 'SF': m.b=0; if(occ[2]) m[3]=4; break;
    case 'DP': m.b=0; if(occ[0]){ force(); m[1]=0; } else { var h2 = occ[2]?3:occ[1]?2:0; if(h2) m[h2]=0; } break;
    default: m.b=0;
  }
  return m;
}
function countRuns(m){ var n=0; Object.keys(m).forEach(function(k){ if(m[k]===4) n++; }); return n; }
function countOuts(m){ var n=0; Object.keys(m).forEach(function(k){ if(m[k]===0) n++; }); return n; }
function defaultRbi(res, m){ return (res==='E' || res==='DP') ? 0 : countRuns(m); }
function movesValid(m){
  var seen = {}, ok = true;
  Object.keys(m).forEach(function(k){ var d=m[k]; if(d>=1 && d<=3){ if(seen[d]) ok=false; seen[d]=1; } });
  return ok;
}

/* ---------- zone helpers ---------- */
function zoneLabel(z, side){
  if(z == null) return '';
  var r = Math.floor(z/5), c = z%5;
  var hl = ['高め','高め','真ん中','低め','低め'][r];
  var inside = side==='左' ? (c>=3) : (c<=1);
  var io = c===2 ? '真ん中' : (inside ? '内角' : '外角');
  var strike = r>=1 && r<=3 && c>=1 && c<=3;
  return (strike ? 'ストライクゾーン' : 'ボールゾーン') + '・' + hl + '・' + io;
}
function zoneParts(z, side){
  if(z == null) return ['','','',''];
  var r = Math.floor(z/5), c = z%5;
  var strike = r>=1 && r<=3 && c>=1 && c<=3;
  var inside = side==='左' ? (c>=3) : (c<=1);
  return [strike?'ストライク':'ボール', ['高め','高め','真ん中','低め','低め'][r], c===2?'真ん中':(inside?'内角':'外角'), (r+1)+'-'+(c+1)];
}
function dirLabel(play){
  if(!play || !play.fld) return '';
  if(play.x == null) return FLD[play.fld];
  var dx = play.x - HOME[0], dy = play.y - HOME[1], dist = Math.sqrt(dx*dx+dy*dy);
  return FLD[play.fld] + (dist > 200 ? '越え' : '');
}
function chainNums(fld, thr){ var seq = [fld].concat(thr || []).filter(Boolean); return seq.length > 1 || (thr && thr.length) ? seq.join('-') : ''; }
function chainNames(fld, thr){ return [fld].concat(thr || []).filter(Boolean).map(function(n){ return FLD[n]; }).join('→'); }
function chainBox(fld, thr, hint){
  var nums = chainNums(fld, thr), h = '<div class="chain" aria-live="polite">';
  if(nums) h += '<b>' + nums + '</b><span class="muted small">' + esc(chainNames(fld, thr)) + '</span><span class="grow"></span><button type="button" class="btn sm" data-a="thrback">1つ消す</button><button type="button" class="btn sm" data-a="thrclear">クリア</button>';
  else h += '<span class="muted small">' + esc(hint) + '</span>';
  return h + '</div>';
}
function fielderChips(action, sel, label){
  return '<div class="fchips" role="group" aria-label="' + esc(label) + '">' + [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button type="button" class="fchip' + (sel===n ? ' on' : '') + '" data-a="' + action + '" data-k="fld" data-v="' + n + '" aria-label="' + posLong(FLD[n]) + '">' + FLD[n] + '<small>' + n + '</small></button>'; }).join('') + '</div>';
}
function playText(pa){
  if(pa.incomplete) return '（攻撃終了で打席途中）';
  var d = PLAY[pa.res] ? PLAY[pa.res].l : (pa.res||'');
  var extra = [];
  if(pa.play){ var dl = dirLabel(pa.play); if(dl) extra.push(dl); if(pa.play.bt) extra.push(BT[pa.play.bt]); var cn = chainNums(pa.play.fld, pa.play.thr); if(cn) extra.push(cn); if(pa.play.rank) extra.push('ランク' + pa.play.rank); }
  return d + (extra.length ? '（' + extra.join('・') + '）' : '');
}

  },
  startgame:startGame,
  zone:function(d){ var z = +d.z; S.ui.z = S.ui.z===z ? null : z; render(); },
  flip:function(){ S.flip = !S.flip; LS.set('ps.flip', S.flip); render(); },
  pt:function(d){ S.ui.pt = S.ui.pt===d.v ? null : d.v; render(); },
  res:function(d){ onResult(d.v); },
  sheet:function(d){
    var st = replay(S.game);
    S.confirm = null; S.ui.edit = null;
    if(d.v==='run'){ S.ui.runType = null; S.ui.thr = []; S.ui.pend = {kind:'run'}; S.ui.moves = defaultRunMoves(null, st.bases.map(Boolean)); S.ui.sheet = 'runners'; return render(); }
    if(d.v==='order'){ S.ui.subSlot = null; S.ui.subTeam = null; }
    S.ui.sheet = d.v; render();
  },
  close:function(){ S.ui.sheet = null; S.ui.pend = null; S.ui.edit = null; S.ui.play = null; S.confirm = null; render(); },
  play:function(d){ var p = S.ui.play; var v = d.k==='fld' ? +d.v : d.v; p[d.k] = p[d.k]===v ? null : v; if(d.k==='res' && p.res==='HR' && !p.bt) p.bt = 'F'; render(); },
  field:function(d, el, ev){
    var svg = el.closest('svg'), r = svg.getBoundingClientRect();
    var x = Math.round((ev.clientX - r.left) / r.width * 300), y = Math.round(38 + (ev.clientY - r.top) / r.height * 236);
    var best = 0, bd = 1e9;
    for(var n=1;n<=9;n++){ var f = FPOS[n], dd = (f[0]-x)*(f[0]-x) + (f[1]-y)*(f[1]-y); if(n===2) dd *= 3; if(dd<bd){ bd = dd; best = n; } }
    var p = S.ui.play; p.x = x; p.y = y; p.fld = best; render();
  },
  playnext:function(){
    var p = S.ui.play; if(!p.res) return;
    var play = {bt:p.bt, x:p.x, y:p.y, fld:p.fld, rank:p.rank};
    if(p.thr && p.thr.length) play.thr = p.thr.slice();
    var u = S.ui, pre = null;
    if(u.edit){ var o = S.game.events[u.edit.idx]; if(o.end && o.end.res===p.res) pre = {moves:o.end.moves, rbi:o.end.rbi}; }
    openRunners({kind:'pa', r:'X', res:p.res, play:play}, ctxState(), pre);
  },
  mv:function(d){ var u = S.ui; u.moves[d.k] = +d.v; if(!u.rbiTouched && u.pend.kind==='pa') u.rbi = defaultRbi(u.pend.res, u.moves); render(); },
  rbi:function(d){ var u = S.ui; u.rbi = Math.max(0, Math.min(4, u.rbi + (+d.v))); u.rbiTouched = true; render(); },
  kswitch:function(d){ var u = S.ui, st = ctxState(); u.pend.res = d.v; u.moves = defaultMoves(d.v, st.bases.map(Boolean)); u.rbi = defaultRbi(d.v, u.moves); render(); },
  runtype:function(d){ var u = S.ui, st = ctxState(); u.runType = d.v; u.moves = defaultRunMoves(d.v, st.bases.map(Boolean)); render(); },
  commitrun:function(){
    var u = S.ui, p = u.pend; if(!movesValid(u.moves)) return;
    if(p.kind==='run'){
      if(!u.runType) return;
      var e = {k:'run', type:u.runType, moves:clone(u.moves)};
      if(u.thr && u.thr.length) e.thr = u.thr.slice();
      if(u.edit){ u.edit.draft = e; return saveEdit(); }
      return pushEvent(e, RUN[u.runType] + 'を記録しました');
    }
    finalizeEnd(p);
  },
  thr:function(d){ var t = S.ui.sheet==='inplay' ? S.ui.play : S.ui; t.thr = (t.thr || []).concat(+d.v).slice(0, 6); render(); },
  thrback:function(){ var t = S.ui.sheet==='inplay' ? S.ui.play : S.ui; if(t.thr) t.thr.pop(); render(); },
  thrclear:function(){ var t = S.ui.sheet==='inplay' ? S.ui.play : S.ui; t.thr = []; render(); },
  editpitch:function(d){ if(S.readOnly) return; var i = +d.i; S.ui.edit = {idx:i, draft:clone(S.game.events[i])}; S.ui.sheet = 'editpitch'; S.confirm = null; render(); },
  er:function(d){ S.ui.edit.draft.r = d.v; render(); },
  ez:function(d){ var dr = S.ui.edit.draft, z = +d.z; dr.z = dr.z===z ? null : z; render(); },
  ept:function(d){ var dr = S.ui.edit.draft; dr.pt = dr.pt===d.v ? null : d.v; render(); },
  saveedit:function(){
    var u = S.ui, ed = u.edit, d = ed.draft, g = S.game, orig = g.events[ed.idx], before = replay(g, ed.idx), need = null;
    if(d.r==='X'){ if(!(orig.r==='X' && orig.end)) need = 'X'; }
    else if(d.r==='HBP'){ if(!(orig.end && orig.end.res==='HBP')) need = 'HBP'; }
    else if(d.r==='B'){ if(before.b>=3){ if(!(orig.end && orig.end.res==='BB')) need = 'BB'; } else delete d.end; }
    else if(d.r==='K' || d.r==='S' || d.r==='BF'){ if(before.s>=2){ if(!(orig.end && (orig.end.res==='K' || orig.end.res==='KWP'))) need = 'K'; } else delete d.end; }
    else if(d.r==='F'){ delete d.end; }
    if(need==='X'){ delete d.end; u.play = {res:null, bt:null, x:null, y:null, fld:null, rank:null, thr:[]}; u.sheet = 'inplay'; return render(); }
    if(need){ delete d.end; return openRunners({kind:'pa', r:d.r, res:need}, before); }
    saveEdit();
  },
  editend:function(d){
    if(S.readOnly) return;
    var i = +d.i, g = S.game, ev = g.events[i], before = replay(g, i), u = S.ui;
    u.edit = {idx:i, draft:clone(ev)};
    var res = ev.end ? ev.end.res : (ev.r==='X' ? 'GO' : ev.r==='HBP' ? 'HBP' : ev.r==='IBB' ? 'IBB' : ev.r==='B' ? 'BB' : 'K');
    if(ev.r==='X'){ var pl = (ev.end && ev.end.play) || {}; u.play = {res:res, bt:pl.bt||null, x:pl.x==null ? null : pl.x, y:pl.y==null ? null : pl.y, fld:pl.fld||null, rank:pl.rank||null, thr:(pl.thr||[]).slice()}; u.sheet = 'inplay'; S.confirm = null; return render(); }
    S.confirm = null;
    openRunners({kind:'pa', r:ev.r, res:res}, before, ev.end ? {moves:ev.end.moves, rbi:ev.end.rbi} : null);
  },
  openpa:function(d){ if(S.readOnly) return; S.ui.paFirst = +d.first; S.ui.edit = null; S.ui.sheet = 'pa'; S.confirm = null; render(); },
  editnote:function(d){
    if(S.readOnly) return;
    var i = +d.i, g = S.game, ev = g.events[i], u = S.ui; S.confirm = null;
    if(ev.k==='run'){ u.edit = {idx:i, draft:clone(ev)}; u.runType = ev.type; u.thr = (ev.thr||[]).slice(); u.pend = {kind:'run'}; u.moves = clone(ev.moves||{}); u.sheet = 'runners'; return render(); }
    u.edit = {idx:i, draft:null}; u.sheet = 'editsub'; render();
  },
  askdelev:function(){ S.confirm = {delev:true}; render(); },
  delev:function(){
    var u = S.ui, g = S.game; if(!u.edit) return;
    g.events.splice(u.edit.idx, 1); S.redo = []; saveGame();
    u.edit = null; u.sheet = null; u.pend = null; u.play = null; S.confirm = null;
    flash('削除しました'); render();
  },
  undo:function(){ var g = S.game; if(!g.events.length) return; S.redo.push(g.events.pop()); saveGame(); flash('1つ戻しました'); render(); },
  redo:function(){ if(!S.redo.length) return; S.game.events.push(S.redo.pop()); saveGame(); flash('やり直しました'); render(); },
  subteam:function(d){ S.ui.subTeam = +d.v; S.ui.subSlot = null; render(); },
  subslot:function(d){
    var st = replay(S.game), t = S.ui.subTeam == null ? S.game.mine : S.ui.subTeam;
    var slot = d.v==='P' ? 'P' : +d.v, cur = slot==='P' ? st.P[t] : st.L[t][slot];
    S.ui.subSlot = slot; S.ui.sub = {pid:'', name:'', num:'', pos:slot==='P' ? '投' : (cur.pos||''), bats:'右', throws:'右', err:''};
    render();
  },
  subback:function(){ S.ui.subSlot = null; render(); },
  dosub:function(){
    var u = S.ui, g = S.game, t = u.subTeam == null ? g.mine : u.subTeam, d = u.sub, player;
    var mineTeam = t===g.mine && S.team.players.length && !S.demo;
    if(mineTeam){ var p = S.team.players.find(function(x){ return x.id===d.pid; }); if(!p){ d.err = '入る選手を選んでください。'; return render(); } player = {pid:p.id, name:p.name, num:p.num||'', bats:p.bats||'右', throws:p.throws||'右'}; }
    else { if(!(d.name||'').trim()){ d.err = '氏名を入れてください。'; return render(); } player = {name:d.name.trim(), num:(d.num||'').trim(), bats:d.bats, throws:d.throws}; }
    var e = {k:'sub', team:t, slot:u.subSlot, player:player, pos:u.subSlot==='P' ? '投' : d.pos};
    u.subSlot = null; pushEvent(e, '交代を記録しました');
  },
  askfinal:function(){ S.confirm = {final:true}; render(); },
  final:function(d){ S.game.status = d.v; S.confirm = null; S.ui.sheet = null; saveGame(); flash(d.v==='final' ? '試合終了にしました' : '試合を再開しました'); render(); },
  logtab:function(d){ S.logTab = d.v; S.csv = null; S.csvMsg = ''; render(); },
  csv:function(d){
    var data = buildCSV(d.v), name = {pitch:'一球データ', bat:'打撃成績', pit:'投手成績'}[d.v] + '_' + S.game.date + '_' + S.game.names[1-S.game.mine] + '.csv';
    name = name.replace(/[\\\/:*?"<>|]/g, '_');
    S.csv = null; S.csvMsg = '';
    if(saveFile(name, data)){ S.csvMsg = name + ' をダウンロードしました。'; render(); }
    else { S.csv = data.replace(/^﻿/, ''); render(); }
  },
  copycsv:function(){
    var ta = document.getElementById('csvbox'), txt = S.csv || '';
    try{ navigator.clipboard.writeText(txt).then(function(){ flash('コピーしました'); render(); }, function(){ if(ta){ ta.focus(); ta.select(); } }); }catch(e){ if(ta){ ta.focus(); ta.select(); } }
  }
};

app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a]'); if(!el || el.disabled) return;
  var a = el.getAttribute('data-a'); if(!A[a]) return;
  if(el.tagName==='svg' || el.closest('svg.field')){ if(a!=='field') return; }
  ev.preventDefault();
  A[a](el.dataset, el, ev);
});
function onBind(ev){
  var el = ev.target, path = el.getAttribute && el.getAttribute('data-bind'); if(!path) return;
  setPath(path, el.value);
  if(el.getAttribute('data-save')==='team' && ev.type==='change') saveTeam();
  if(path.indexOf('setup.my.')===0 && path.slice(-4)==='.pid' && ev.type==='change'){
    var i = +path.split('.')[2], p = S.team.players.find(function(x){ return x.id===el.value; });
    if(p && !S.setup.my[i].pos && POS_NUM[p.pos]) S.setup.my[i].pos = p.pos;
  }
  if(path==='ui.sub.pid' && ev.type==='change'){ var q = S.team.players.find(function(x){ return x.id===el.value; }); if(q && S.ui.sub && !S.ui.sub.pos) S.ui.sub.pos = POS_NUM[q.pos] ? q.pos : ''; }
  if(ev.type==='change' && el.getAttribute('data-rerender')) render();
}
app.addEventListener('input', onBind);
app.addEventListener('change', onBind);
app.addEventListener('change', function(ev){ if(ev.target && ev.target.id==='import-file'){ importGames(ev.target.files); ev.target.value = ''; } });
app.addEventListener('keydown', function(ev){ if(ev.key==='Enter' && ev.target && (ev.target.id==='lg-pass' || ev.target.id==='lg-email')){ ev.preventDefault(); A.login(); } });
window.addEventListener('online', function(){ setSync(S.sync); if(S.syncFailed && S.db) startSession(); });
window.addEventListener('offline', function(){ setSync(S.sync); });
window.addEventListener('hashchange', function(){
  var id = (location.hash || '').replace(/^#/, ''), g = S.games[id];
  if(!g || (S.game && S.game.id===id && !S.demo && (S.view==='score' || S.view==='live' || S.view==='log'))) return;
  S.autoOpened = true; S.game = g; S.demo = false; S.redo = []; S.ui = freshUI(); watchGame(); go(S.readOnly ? 'live' : 'score');
});

/* ---------- boot ---------- */
function startSession(){
  stopListeners();
  var u = S.user;
  S.readOnly = !u || !!S.denied;
  S.mode = 'db';
  if(S.readOnly){ S.games = {}; }
  else { S.team = LS.get('ps.team', {name:'', players:[], rev:0}); S.games = LS.get('ps.games', {}); }
  var retry = false;
  return syncFromDb().then(function(){ S.syncFailed = false; }, function(e){
    if(!S.readOnly && e && e.code==='permission-denied'){ S.denied = true; retry = true; return; }
    S.syncFailed = true; if(S.readOnly) S.fbFail = true;
  }).then(function(){
    if(retry) return startSession();
    S.ready = true;
    if(S.game && !S.demo && S.games[S.game.id]) S.game = S.games[S.game.id];
    else if(S.game && !S.demo && S.readOnly){ S.game = null; }
    if(S.readOnly){
      if(S.view!=='login' && S.view!=='home' && S.view!=='live') S.view = S.game ? 'live' : 'home';
      if(S.view==='live' && !S.game) S.view = 'home';
      watchList();
    } else {
      if(S.view==='login') S.view = 'home';
      if(S.view==='live') S.view = S.game ? 'score' : 'home';
      if(S.view==='home' && !S.game) S.view = 'home';
    }
    watchGame(); autoOpen(); saverListen(); saverKick(); render();
  });
}
function boot(){
  var saved = {};
  try{ saved = JSON.parse(sessionStorage.getItem('ps.view') || '{}') || {}; }catch(e){}
  S.fb = fbConfigured();
  S.team = LS.get('ps.team', {name:'', players:[], rev:0});
  S.games = LS.get('ps.games', {});
  var scorerHere = !!LS.get('ps.scorer', '');
  if(S.fb && !scorerHere){ S.readOnly = true; S.games = {}; }
  if(saved && saved.view && saved.view!=='home' && saved.view!=='login'){
    if(saved.demo && saved.demoGame){ S.game = saved.demoGame; S.demo = true; }
    else if(saved.gameId && S.games[saved.gameId]) S.game = S.games[saved.gameId];
    if(!S.readOnly && (S.game || saved.view==='roster')) S.view = saved.view==='setup' ? 'home' : (saved.view==='live' ? 'score' : saved.view);
  }
  if(!S.fb){ S.ready = true; S.dbChecked = true; render(); saverInit(); return; }
  if(!S.readOnly) S.ready = true;
  render();
  saverInit();
  Store.connect().then(function(db){
    S.dbChecked = true;
    if(!db){ S.fbFail = true; S.ready = true; render(); return; }
    S.db = db; S.fbFail = false;
    var first = true;
    FB.auth.onAuthStateChanged(function(u){
      var had = scorerHere;
      S.user = u ? {uid:u.uid, email:u.email || ''} : null;
      if(u){ LS.set('ps.scorer', u.email || '1'); scorerHere = true; }
      else { try{ localStorage.removeItem('ps.scorer'); }catch(e){} scorerHere = false; }
      if(!u && had && first){ S.login = {expired:true}; S.view = 'login'; S.game = null; }
      if(!first && !u){ S.view = 'home'; S.game = null; S.autoOpened = true; }
      if(!first && u){ S.view = 'home'; S.game = null; S.denied = false; }
      first = false;
      startSession();
    });
  });
}
try{ boot(); }catch(e){ console.error(e); }
})();
